server.port=8085
spring.application.name=order-service

spring.datasource.url=jdbc:mysql://localhost:3306/quickbite_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Other services this service talks to
cart.service.url=http://localhost:8084


# RabbitMQ Config
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# where order-service sends messages and from where notification-service receives messages
rabbitmq.exchange=quickbite.exchange

# Routing keys — one per order event
rabbitmq.routing.key.order.placed=order.placed
rabbitmq.routing.key.order.confirmed=order.confirmed
rabbitmq.routing.key.order.preparing=order.preparing
rabbitmq.routing.key.order.pickedup=order.pickedup
rabbitmq.routing.key.order.delivered=order.delivered
rabbitmq.routing.key.order.cancelled=order.cancelled

# Eureka Registration
# Register this service with Eureka so Gateway can find it
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# How often this service sends heartbeat to Eureka (seconds)
eureka.instance.lease-renewal-interval-in-seconds=10

# How long Eureka waits before removing unresponsive service
eureka.instance.lease-expiration-duration-in-seconds=30
