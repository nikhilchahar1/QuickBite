server.port=8085
spring.application.name=order-service

spring.datasource.url=jdbc:mysql://localhost:3306/quickbite_order?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=quickbite_super_secret_key_2026_very_long_string_for_security
jwt.expiration=86400000

# Other services this service talks to
cart.service.url=http://localhost:8084


# RabbitMQ Config
spring.rabbitmq.host=localhost
spring.rabbitmq.port=15672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# where order-service sends messages and from where notification-service receives messages
rabbitmq.exchange=quickbite.exchange

# Routing keys — one per order event
rabbitmq.routing.key.order.placed=order.placed
rabbitmq.routing.key.order.confirmed=order.confirmed
rabbitmq.routing.key.order.preparing=order.preparing
rabbitmq.routing.key.order.pickedup=order.pickedup
rabbitmq.routing.key.order.delivered=order.delivered
rabbitmq.routing.key.order.cancelled=order.cancelled