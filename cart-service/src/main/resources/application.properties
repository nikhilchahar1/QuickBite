server.port=8084
spring.application.name=cart-service

spring.datasource.url=jdbc:mysql://localhost:3306/quickbite_cart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=quickbite_super_secret_key_2026_very_long_string_for_security
jwt.expiration=86400000

# URL of menu-service
# cart-service calls menu-service to validate items exist
menu.service.url=http://localhost:8083