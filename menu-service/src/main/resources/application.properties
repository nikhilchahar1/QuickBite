server.port=8083
spring.application.name=menu-service

spring.datasource.url=jdbc:mysql://localhost:3306/quickbite_menu?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Registration
# Register this service with Eureka so Gateway can find it
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# How often this service sends heartbeat to Eureka (seconds)
eureka.instance.lease-renewal-interval-in-seconds=10

# How long Eureka waits before removing unresponsive service
eureka.instance.lease-expiration-duration-in-seconds=30