server.port=8082
spring.application.name=restaurant-service

spring.datasource.url=jdbc:mysql://localhost:3306/quickbite_restaurant?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Same JWT secret as auth-service
# This service reads tokens but does not create them
jwt.secret=quickbite_super_secret_key_2026_very_long_string_for_security
jwt.expiration=86400000

# URL of auth-service — used to validate tokens
auth.service.url=http://localhost:8081