# Port this service runs on
server.port=8081

# Application name
spring.application.name=auth-service

# ==================
# Database Config
# ==================
spring.datasource.url=jdbc:mysql://localhost:3306/quickbite_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================
# JPA / Hibernate
# ==================
# update = creates tables automatically from your Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==================
# JWT Config
# ==================
# This is the secret key used to sign JWT tokens
jwt.secret=quickbite_super_secret_key_2026_very_long_string_for_security
jwt.expiration=86400000
# 86400000 milliseconds = 24 hours